<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadon Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-5 text-center">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h3 class="text-success mb-4">Thank you for your business!</h3>
            
            <div class="alert alert-warning py-3">
                <p class="mb-0 fs-5">We charged your credit card for <strong>${{ last_charge|stringformat:".2f" }}</strong></p>
            </div>
            
            <div class="mt-4 text-muted">
                <p>You have ordered <strong>{{ total_items }}</strong> items so far and spent <strong>${{ total_spent|stringformat:".2f" }}</strong> with Amadon.com!</p>
            </div>
            
            <hr class="my-4">
            <p><a href="/" class="btn btn-primary">Go Back</a></p>
        </div>
    </div>
</body>
</html>
