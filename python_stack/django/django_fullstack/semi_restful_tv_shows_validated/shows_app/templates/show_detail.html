<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV Show {{ show.id }}</title>
</head>
<body>
    <a href="/shows">All Shows</a>
    <h1>TV Show {{ show.id }}</h1>
    <p><strong>Title:</strong> {{ show.title }}</p>
    <p><strong>Network:</strong> {{ show.network }}</p>
    <p><strong>Release Date:</strong> {{ show.release_date }}</p>
    <p><strong>Description:</strong> {{ show.description|default:"No description provided." }}</p>
    
    <hr>
    <a href="/shows/{{ show.id }}/edit/">Edit</a> | 
    <a href="/shows/{{ show.id }}/destroy/">Delete</a>
</body>
</html>
