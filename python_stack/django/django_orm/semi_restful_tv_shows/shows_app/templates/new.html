<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add a New Show</title>
</head>
<body>
    <div style="width: 400px;">
        <h2 style="display: inline-block;">Add a New Show</h2>
        <a href="/shows" style="float: right; margin-top: 25px;">Go Back</a>
        
        <form action="/shows/create" method="POST">
            {% csrf_token %}
            <p>
                <label>Title</label><br>
                <input type="text" name="title" style="width: 100%;" required>
            </p>
            <p style="display: flex; gap: 20px;">
                <span style="flex: 1;">
                    <label>Network</label><br>
                    <input type="text" name="network" style="width: 100%;" required>
                </span>
                <span style="flex: 1;">
                    <label>Release Date</label><br>
                    <input type="date" name="release_date" style="width: 100%;" required>
                </span>
            </p>
            <p>
                <label>Description</label><br>
                <textarea name="desc" rows="5" style="width: 100%;" required></textarea>
            </p>
            <button type="submit">Create</button>
        </form>
    </div>
</body>
</html>
