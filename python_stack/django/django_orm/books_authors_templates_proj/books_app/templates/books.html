<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 50px; padding: 20px; }
        form { display: flex; flex-direction: column; width: 250px; gap: 10px; }
        table { border-collapse: collapse; width: 400px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div>
        <h2>Add a Book</h2>
        <form action="/books/create" method="POST">
            {% csrf_token %}
            <label>Title</label>
            <input type="text" name="title" required>
            <label>Description</label>
            <textarea name="desc" rows="4" required></textarea>
            <button type="submit">Add</button>
        </form>
        <p><a href="/authors">Go to Authors Page</a></p>
    </div>
    <div>
        <h2>Books Table</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for book in all_books %}
                <tr>
                    <td>{{ book.id }}</td>
                    <td>{{ book.title }}</td>
                    <td><a href="/books/{{ book.id }}">View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
