<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dojo Survey - Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

    <div class="container bg-white p-4 rounded shadow" style="max-width: 600px;">
        <h2 class="mb-4 text-center text-success text-decoration-underline">Submitted Info</h2>
        
        <table class="table table-bordered align-middle">
            <tr>
                <th class="w-50 bg-light">Name:</th>
                <td>{{ context_name }}</td>
            </tr>
            <tr>
                <th class="bg-light">Dojo Location:</th>
                <td>{{ context_location }}</td>
            </tr>
            <tr>
                <th class="bg-light">Favorite Language:</th>
                <td>{{ context_language }}</td>
            </tr>
            <tr>
                <th class="bg-light">Bootcamp Type:</th>
                <td>{{ context_bootcamp_type }}</td>
            </tr>
            <tr>
                <th class="bg-light">Selected Interests:</th>
                <td>{{ context_interests }}</td>
            </tr>
            <tr>
                <th class="bg-light">Comment:</th>
                <td>{{ context_comment }}</td>
            </tr>
        </table>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary px-4">Go Back</a>
        </div>
    </div>

</body>
</html>
