<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container counter-container mt-5">
    <h1 class="mb-4">Counter</h1>
    
    <div class="alert alert-info">
        <h2>Page Visits: {{ request.session.visits }}</h2>
        <h2>Counter Value: {{ request.session.counter }}</h2>
    </div>

    <div class="d-flex gap-2 mt-4">
        <form action="/plus_two" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">+2</button>
        </form>

        <form action="/custom_increment" method="post" class="d-flex gap-1">
            {% csrf_token %}
            <input type="number" name="increment_by" class="form-control" placeholder="Number" required>
            <button type="submit" class="btn btn-success">Increase</button>
        </form>

        <form action="/reset" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning">Reset</button>
        </form>
    </div>

    <hr>
    
    <form action="/destroy_session" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Destroy Session</button>
    </form>
</div>

</body>
</html>
